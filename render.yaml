services:
  - type: web
    name: nirmaan
    env: python
    region: oregon
    plan: free
    branch: main

    build:
      env:
        PYTHON_VERSION: 3.11
      commands:
        - pip install -r requirements.txt

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11
